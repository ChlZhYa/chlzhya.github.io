<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta
      name="description"
      content="Flow 浮流：留下小想法、偶然发现和突然想通的瞬间。"
    />
    <title>Flow · 浮流</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f6f7fb'/%3E%3Ctext x='7' y='44' font-family='Arial' font-size='34' font-weight='bold' fill='%236554e8'%3Efl%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#app">跳转到正文</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="#/flow" aria-label="Flow 浮流，返回 Flow"
          >flow</a
        >
        <nav class="main-nav" aria-label="主导航">
          <a href="#/flow" data-nav="journal">Flow</a>
          <a href="#/essays" data-nav="essays">文章</a>
          <a href="#/about" data-nav="about">关于</a>
        </nav>
        <button class="header-write write-trigger" type="button">
          记一笔 <span aria-hidden="true">＋</span>
        </button>
        <button
          class="icon-button search-trigger"
          type="button"
          aria-label="搜索记录"
          title="搜索记录"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle
              cx="10.7"
              cy="10.7"
              r="6.4"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <path
              d="m15.6 15.6 5 5"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </header>

      <main id="app" tabindex="-1"></main>
      <p
        id="site-status"
        class="site-status"
        role="status"
        aria-live="polite"
      ></p>

      <footer class="site-footer">
        <span><strong>flow</strong>　 念头流过，就留在这里。</span>
        <span class="footer-right"
          ><button class="text-button export-trigger" type="button">
            导出我的记录</button
          ><span>Flow © 2026</span></span
        >
      </footer>
    </div>

    <dialog
      id="search-dialog"
      class="modal search-modal"
      aria-labelledby="search-title"
    >
      <div class="dialog-head">
        <div>
          <p class="eyebrow">FIND A MOMENT</p>
          <h2 id="search-title">寻找一段记录</h2>
        </div>
        <button
          class="icon-button dialog-close"
          type="button"
          aria-label="关闭搜索"
        >
          ×
        </button>
      </div>
      <label class="search-field"
        ><span class="sr-only">搜索标题与正文</span
        ><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle
            cx="10.7"
            cy="10.7"
            r="6.4"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="m15.6 15.6 5 5"
            stroke="currentColor"
            stroke-width="1.5"
          /></svg
        ><input
          id="search-input"
          type="search"
          placeholder="搜索标题、正文、分类或标签…"
          autocomplete="off"
      /></label>
      <p class="search-hint">包含示例内容和当前浏览器保存的记录。</p>
      <div id="search-results" class="search-results" aria-live="polite"></div>
    </dialog>

    <dialog
      id="write-dialog"
      class="modal write-modal"
      aria-labelledby="write-title"
    >
      <div class="dialog-head">
        <div>
          <p class="eyebrow">A NOTE TO KEEP</p>
          <h2 id="write-title">写下这一刻</h2>
        </div>
        <button
          class="icon-button dialog-close"
          type="button"
          aria-label="关闭写作窗口"
        >
          ×
        </button>
      </div>
      <form id="entry-form" novalidate>
        <label class="body-label"
          >正文<textarea
            name="body"
            rows="9"
            maxlength="30000"
            placeholder="此刻在想什么？"
            required
          ></textarea>
        </label>
        <label class="title-label"
          >标题 <span class="optional">选填</span
          ><input
            name="title"
            type="text"
            maxlength="100"
            placeholder="选填，留空将用正文第一行"
        /></label>
        <div class="form-pair entry-meta">
          <label
            >记录类型<select name="kind" required>
              <option value="log">Flow</option>
              <option value="essay">文章</option>
            </select></label
          >
          <label>日期<input name="date" type="date" required /></label>
        </div>
        <div class="form-pair entry-details">
          <label
            >分类<select name="category" required>
              <option value="AI / Agent">AI / Agent</option>
              <option value="开发">开发</option>
              <option value="阅读">阅读</option>
              <option value="灵感" selected>灵感</option>
              <option value="学习">学习</option>
              <option value="生活">生活</option>
              <option value="其他">其他</option>
            </select></label
          >
          <label
            >标签 <span class="optional">选填，用逗号分隔</span
            ><input
              name="tags"
              type="text"
              maxlength="256"
              placeholder="例如：RAG，笔记"
          /></label>
        </div>
        <p id="form-message" class="form-message" role="alert"></p>
        <button id="save-as-new" class="outline-button" type="button" hidden>另存为新记录</button>
        <div class="form-actions">
          <button id="discard-draft" class="text-button" type="button" hidden>舍弃草稿</button>
          <button class="text-button cancel-write" type="button">稍后继续</button
          ><button class="solid-button save-entry" type="submit">
            保存到此浏览器 <span aria-hidden="true">↗</span>
          </button>
        </div>
      </form>
      <p class="storage-note">
        未完成的草稿只在此标签页保留，刷新可继续；关闭标签页或清除站点数据后可能丢失。已保存的记录请定期导出备份。
      </p>
    </dialog>
  </body>
</html>
