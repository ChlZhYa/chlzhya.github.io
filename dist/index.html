<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta
      name="description"
      content="Flow 浮流：留下小想法、偶然发现和突然想通的瞬间。"
    />
    <title>Flow · 浮流</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='9' fill='%236554e8'/%3E%3Cpath d='M7 16.5C9.8 10.5 13 10.5 16 16.5S22.2 22.5 25 16.5' fill='none' stroke='%23fff' stroke-width='2.8' stroke-linecap='round'/%3E%3Ccircle cx='24.6' cy='11.4' r='2.1' fill='%23fff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#app">跳转到正文</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="#/flow" aria-label="Flow 浮流，返回 Flow"
          ><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"
            ><rect x="1" y="1" width="30" height="30" rx="9" fill="#6554e8"
            /><path
              d="M7 16.5C9.8 10.5 13 10.5 16 16.5S22.2 22.5 25 16.5"
              fill="none"
              stroke="#fff"
              stroke-width="2.8"
              stroke-linecap="round"
            /><circle cx="24.6" cy="11.4" r="2.1" fill="#fff" /></svg
          >flow</a
        >
        <nav class="main-nav" aria-label="主导航">
          <a href="#/flow" data-nav="journal">Flow</a>
          <a href="#/essays" data-nav="essays">文章</a>
          <a href="#/about" data-nav="about">关于</a>
        </nav>
        <button
          class="icon-button search-trigger"
          type="button"
          aria-label="搜索记录"
          title="搜索记录"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle
              cx="10.7"
              cy="10.7"
              r="6.4"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <path
              d="m15.6 15.6 5 5"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </header>

      <main id="app" tabindex="-1"></main>
      <p
        id="site-status"
        class="site-status"
        role="status"
        aria-live="polite"
      ></p>

      <footer class="site-footer">
        <span
          ><svg class="brand-mark footer-mark" viewBox="0 0 32 32" aria-hidden="true"
            ><rect x="1" y="1" width="30" height="30" rx="9" fill="#6554e8"
            /><path
              d="M7 16.5C9.8 10.5 13 10.5 16 16.5S22.2 22.5 25 16.5"
              fill="none"
              stroke="#fff"
              stroke-width="2.8"
              stroke-linecap="round"
            /><circle cx="24.6" cy="11.4" r="2.1" fill="#fff" /></svg
          ><strong>flow</strong>　 念头流过，就留在这里。</span
        >
        <span class="footer-right"
          ><button class="text-button export-trigger" type="button">
            导出我的记录</button
          ><span>Flow © 2026</span></span
        >
      </footer>
    </div>

    <dialog
      id="search-dialog"
      class="modal search-modal"
      aria-labelledby="search-title"
    >
      <div class="dialog-head">
        <div>
          <p class="eyebrow">FIND A MOMENT</p>
          <h2 id="search-title">寻找一段记录</h2>
        </div>
        <button
          class="icon-button dialog-close"
          type="button"
          aria-label="关闭搜索"
        >
          ×
        </button>
      </div>
      <label class="search-field"
        ><span class="sr-only">搜索标题与正文</span
        ><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle
            cx="10.7"
            cy="10.7"
            r="6.4"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="m15.6 15.6 5 5"
            stroke="currentColor"
            stroke-width="1.5"
          /></svg
        ><input
          id="search-input"
          type="search"
          placeholder="搜索标题、正文、分类或标签…"
          autocomplete="off"
      /></label>
      <p class="search-hint">包含示例内容和当前浏览器保存的记录。</p>
      <div id="search-results" class="search-results" aria-live="polite"></div>
    </dialog>

  </body>
</html>
